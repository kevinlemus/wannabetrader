spring.application.name=wannabetrader
server.port=8080

# HTTPS - Schwab only sends you back to an https:// address.
# The certificate is self-made (browser warns "Not secure" once - click Advanced > Continue).
# Password is in application-local.properties. To make a new certificate (lasts 10 years):
#   keytool -genkeypair -alias wannabetrader -keyalg RSA -keysize 2048 -storetype PKCS12
#     -keystore src/main/resources/ssl/keystore.p12 -validity 3650 -dname "CN=127.0.0.1"
#     -ext "SAN=IP:127.0.0.1,DNS:localhost"
server.ssl.key-store=classpath:ssl/keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=wannabetrader

# Database - PostgreSQL on this computer. Password is in application-local.properties.
spring.datasource.url=jdbc:postgresql://localhost:5432/wannabetrader
spring.datasource.username=wannabetrader

# Hibernate creates and updates the tables from the model classes by itself
spring.jpa.hibernate.ddl-auto=update
# Don't keep a database connection open while the browser page is being sent
spring.jpa.open-in-view=false

# Private settings (Schwab app key + secret) live in this git-ignored file
spring.config.import=optional:classpath:application-local.properties

# Schwab login - the callback must match your Schwab app EXACTLY
schwab.auth-url=https://api.schwabapi.com/v1/oauth/authorize
schwab.token-url=https://api.schwabapi.com/v1/oauth/token
schwab.callback-url=https://127.0.0.1:8080/api/auth/callback

# Schwab trading data (accounts, orders, trades)
schwab.trader-url=https://api.schwabapi.com/trader/v1
